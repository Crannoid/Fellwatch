services:
  fellwatch:
    build: .
    container_name: fellwatch
    restart: unless-stopped
    environment:
      MOUNTAIN_AREA: lake-district
      CAPTURE_HOUR: "7" # local container time — see README re: TZ
      CAPTURE_MINUTE: "0"
      LOG_LEVEL: INFO
      NOTIFY_URL: "${NOTIFY_URL:-}" # set in .env (gitignored); ntfy-style URL POSTed to on capture failures; blank disables
      TZ: Europe/London
    volumes:
      - ${FELLWATCH_DATA:-./data}:/data

  grafana:
    image: grafana/grafana:11.3.0
    container_name: fellwatch-grafana
    restart: unless-stopped
    depends_on:
      - fellwatch
    environment:
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
      TZ: Europe/London
    ports:
      - "3010:3000" # host:container — 3000 was already taken on containerHost; access Grafana at :3010
    volumes:
      - ${FELLWATCH_DATA:-./data}:/data:ro # read-only: Grafana only ever reads this dataset, never writes it
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-storage:/var/lib/grafana # Grafana's own settings/dashboards/users

volumes:
  grafana-storage:
